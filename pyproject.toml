[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vewsnake"
version = "1.0.0"
description = "vewSnake: A lightweight, open-source CLI image generator for low-resource systems. No API key required."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raj Gautam" }]
keywords = ["image-generation", "cli", "ai", "stable-diffusion", "open-source"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "requests>=2.28",
    "Pillow>=10.0",
]

[project.scripts]
vewsnake = "vewsnake.cli:main"
vewsnake-gui = "vewsnake.gui:main"

[project.urls]
Homepage = "https://github.com/rajgautam/vewSnake"

[tool.setuptools.packages.find]
include = ["vewsnake*"]
